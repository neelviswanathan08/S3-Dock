# =====================================================================
# S3-DOCK: MASTER CONFIGURATION FILE
# =====================================================================

# --- 1. FACTORY RUN SETTINGS ---
run_folder_name: "S3-Dock_MDM2_Candidate"
num_seeds:  10
top_k: 1   # Default to 1000 tracks (Ignored if benchmark_mode is true)
samples_per_seed: 5           # 1 structural prediction per fasta seed entry
max_discovery_loops: 5
deep_dive_samples: 25

# --- 2. PEPTIDE DESIGN CONSTRAINTS ---
peptide_length: 12

# Structural Control ("helix" or "beta_sheet")
secondary_structure: "[enter_secondary_structure_here]"  

# Chemical Property ("amphipathic", "hydrophobic", "hydrophilic")
peptide_property: "{enter_peptide_property_here}"

# Override (Leave blank "" to let the pipeline build the H/P pattern automatically)
custom_pattern: ""

# 🔬 BENCHMARK GATEKEEPER MATRIX
# Set benchmark_mode to true to duplicate the sequence across 1000 slots and select the top 1
benchmark_mode: false                        
benchmark_sequence: "{enter_benchmark_sequence_here}"  # PSM-alpha-3 Control Sequence
benchmark_samples: 150                    # Total fasta seeds to write into library.fasta

# Strict Biochemical Filtering Targets (Used if benchmark_mode is false)
target_net_charge: [net_charge_value]    # Target electrical charge at pH 7.4
boman_index_min: [boman_index_value]         # Minimum binding potential/solubility
hydrophobic_moment_target: [enter_hydrophobic_moment_value]  # Target hydrophobic moment for amphipathic peptides

# --- 2b. EVOLUTIONARY OPTIMIZER (MONTE CARLO) SETTINGS ---
rng_seed: 7237     # Master RNG seed for deep learning and optimizer reproducibility
charge_tolerance: 0.5  # Tolerence for the net charge of the peptide (pH 7.4)      
charge_weight: 10  # Weight for the net charge of the peptide (pH 7.4) in the scoring function          
boman_weight: 5    # Weight for the Boman index of the peptide in the scoring function          
moment_weight: 5   # Weight for the hydrophobic moment of the peptide in the scoring function          
max_mutations: 50000  # Maximum number of mutations to perform in the Monte Carlo optimization       
plateau_patience: 800  # Number of iterations to wait for improvement before early stopping      
initial_temp: 1.5     # Initial temperature for the Monte Carlo optimization       
cooling_rate: 0.9995  # Cooling rate for the Monte Carlo optimization       
dedupe_output: True   # Whether to remove duplicate sequences from the output       

# --- 3. DYNAMIC RECEPTOR TARGET SETTINGS ---
target_cif: "{enter_path}" # Path to the CIF file of the target receptor
binder_chain_id: "{chain_id}" # Chain ID of the binder peptide in the CIF file
is_fibril: false # Whether the target is a fibril (true) or not (false)

target_chains_and_sequences:
  {chain_ID}: "{ enter_sequence }" # Sequence of the target receptor chain 

# --- 4. UNIVERSAL STRUCTURAL POCKET CONSTRAINTS ---
max_distance_threshold: 5.0 # Maximum distance threshold for pocket contacts (in Angstroms)
pocket_contacts: # List of pocket contacts to enforce during docking (format: [chain_id, residue_number])
  - ["{chain_ID}", {enter_residue_number}]
  - ["{chain_ID}", {enter_residue_number}]
  - ["{chain_ID}", {enter_residue_number}]
  - ["{chain_ID}", {enter_residue_number}]
  - ["{chain_ID}", {enter_residue_number}]
  - ["{chain_ID}", {enter_residue_number}]
  - ["{chain_ID}", {enter_residue_number}]
  - ["{chain_ID}", {enter_residue_number}]
  - ["{chain_ID}", {enter_residue_number}]
  - ["{chain_ID}", {enter_residue_number}]
  - ["{chain_ID}", {enter_residue_number}]
  - ["{chain_ID}", {enter_residue_number}]
  - ["{chain_ID}", {enter_residue_number}]
  - ["{chain_ID}", {enter_residue_number}]
  - ["{chain_ID}", {enter_residue_number}]
  - ["{chain_ID}", {enter_residue_number}]
  - ["{chain_ID}", {enter_residue_number}]

# --- 5. QUALITY CONTROL GATEKEEPERS ---
enforce_boltz_constraints: true # Whether to enforce Boltzmann constraints during optimization
require_pocket_filter: true # Whether to require pocket contact filtering during optimization
min_pocket_contacts: 4  # Minimum number of pocket contacts required for a valid docking pose
max_distance_threshold: 8 # Maximum distance threshold for pocket contacts (in Angstroms) for filtering
use_msa_filter: true # Whether to use MSA filtering during optimization
tm_threshold: 0.85 # Minimum TM-score threshold for structural similarity filtering


# --- 6. HADDOCK3 BLIND GLOBAL DOCKING SETTINGS ---
rnd_haddock_seed: 100 # Random seed for HADDOCK3 docking reproducibility
run_haddock: false  # Whether to run HADDOCK3 docking (true) or skip it (false)             
haddock_sampling: 1000  # Number of docking poses to sample in HADDOCK3            
haddock_seletop: 100   # Number of top docking poses to select for further analysis in HADDOCK3             
haddock_top_clusters: 10 # Number of top docking clusters to analyze in HADDOCK3

# --- 7. OPENMM MOLECULAR DYNAMICS SETTINGS ---
extend_simulation: true   # Whether to extend the molecular dynamics simulation (true) or not (false)
md_simulation_steps: 100000      # Production-scale trajectory length
md_reporting_interval: 10000         # Yields exactly 5,000 saved trajectory frames
md_temperature_kelvin: 310.15 # Temperature for the molecular dynamics simulation (in Kelvin)
md_NaCl_concentration: 0.150   # Salt concentration for the molecular dynamics simulation (in Molar)    

# --- 8. MMPBSA ENERGY CALCULATION SETTINGS ---
mmpbsa_start_frame: 0 # Starting frame for MMPBSA energy calculations (0 = first frame)
mmpbsa_end_frame: -1 # Ending frame for MMPBSA energy calculations (-1 = last frame)
mmpbsa_interval: 1 # Interval for MMPBSA energy calculations (1 = every frame)
mmpbsa_salt_concentration: 0.150 # Salt concentration for MMPBSA energy calculations (in Molar)

# --- DYNAMIC ANALYSIS WINDOW CONFIGURATION ---
analysis_start_frame: 5  # Set to your desired start (e.g., 70ns)
analysis_end_frame: -1      # -1 means go all the way to the final frame
analysis_stride: 1          # Stride interval for plotting and calculations
